  ccscript_erase_chip:
    desc: "Erase Application and HSM"
    cmds:
    - echo "=================================================="
    - echo "Erase Application and HSM"
    - echo "=================================================="
    - >
      py {{.ti_ccs_script_launcher}} ./script/ccs/erase_chip.py

  ccscript_soft_reset:
    desc: "Soft Reset"
    cmds:
    - echo "=================================================="
    - echo "Soft Reset"
    - echo "=================================================="
    - >
      py {{.ti_ccs_script_launcher}} ./script/ccs/soft_reset.py

  xds110_pin_reset:
    desc: "Reset Device(Pin Reset)"
    cmds:
    - echo "=================================================="
    - echo "Reset Device(Pin Reset)"
    - echo "=================================================="
