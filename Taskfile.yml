# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

# Load .env file of workspace
dotenv: [ ".env" ]

# Echo off
silent: true

vars:
  workspace_dir: "{{.ROOT_DIR}}"
  ti_gmake_dir: "{{.ENV_CCS_INSTALL_DIR}}/utils/bin"
  
  ti_openocd_bin_dir: "{{.ROOT_DIR}}/{{.ENV_OPENOCD_REL_DIR}}/bin"
  ti_openocd_script_dir: "{{.ROOT_DIR}}/{{.ENV_OPENOCD_REL_DIR}}/share/openocd/scripts"

  ti_ccs_script_launcher: "{{.ENV_CCS_INSTALL_DIR}}/scripting/python/launcher.py"

tasks:
  util_code_line_count:
    desc: "Count code lines"
    cmds:
    - echo "=================================================="
    - echo "Count Code Lines of Project"
    - echo "=================================================="    
    - >
      tool/cli/scc ./ccs_project/src

  util_port_list:
    desc: "List serial port"
    cmds:
    - echo "=================================================="
    - echo "List Serial Port"
    - echo "=================================================="
    - >
      tool/cli/lser.exe

  ccs_build_project:
    desc: "Build project"
    dir: "{{.workspace_dir}}/ccs_project/{{.ENV_CCS_BUILD_TARGET}}"
    cmds:
    - echo "=================================================="
    - echo "Build Project"
    - echo "=================================================="
    - >
      {{.ti_gmake_dir}}/gmake.exe -s -k -j 24 all -r -O

  ccs_clean_project:
    desc: "Clean project"
    dir: "{{.workspace_dir}}/ccs_project/{{.ENV_CCS_BUILD_TARGET}}"
    cmds:
    - echo "=================================================="
    - echo "Clean Project"
    - echo "=================================================="
    - >
      {{.ti_gmake_dir}}/gmake.exe -s -k -j 24 clean -r -O

  ccs_rebuild_project:
    desc: "Rebuild project"
    dir: "{{.workspace_dir}}/ccs_project/{{.ENV_CCS_BUILD_TARGET}}"
    deps: [ccs_clean_project, ccs_build_project]
    cmds:
    - echo "=================================================="
    - echo "Rebuild Project"
    - echo "=================================================="

  ccscript_read_hsm_ver:
    desc: "Read HSM version"
    cmds:
    - echo "=================================================="
    - echo "Read HSM Version"
    - echo "=================================================="
    - >
      py {{.ti_ccs_script_launcher}} ./script/ccs/read_hsm_version.py

  ccscript_check_blank:
    desc: "Check blank"
    cmds:
    - echo "=================================================="
    - echo "Check blank"
    - echo "=================================================="
    - >
      py {{.ti_ccs_script_launcher}} ./script/ccs/check_blank.py

  ccscript_program_hsm:
    desc: "Program HSM"
    cmds:
    - echo "=================================================="
    - echo "Program HSM"
    - echo "=================================================="
    - >
      py {{.ti_ccs_script_launcher}} ./script/ccs/program_hsm.py

  ccscript_program_app:
    desc: "Program Application"
    cmds:
    - echo "=================================================="
    - echo "Program Application"
    - echo "=================================================="
    - >
      py {{.ti_ccs_script_launcher}} ./script/ccs/program_hex.py

  # ccscript_TEST:
